name: Deploy Static Website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Job 1: Prepare and upload the website
  build:
    name: Build and Upload Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Website Files
        run: |
          echo "Checking website files..."
          ls -lah

          if [ ! -f "index.html" ]; then
            echo "::error::index.html not found in repository root"
            exit 1
          fi

          echo "Website files verified successfully."

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

  # Job 2: Deploy uploaded artifact
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
